[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".delivery", ".venv", "data", "pgdata", "test-results", "exports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"] # CLI scripts add repository root before importing backend.

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
show_missing = true
skip_empty = true
