name: Test and container smoke
on:
  push:
    paths-ignore: ['**/*.md', 'reports/**']
  pull_request:
    paths-ignore: ['**/*.md', 'reports/**']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: knowbase
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: knowbase_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U knowbase -d knowbase_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RAG_TEST_DATABASE_URL: postgresql://knowbase:ci-test-only@localhost:5432/knowbase_test
      RAG_BENCHMARK_DATABASE_URL: postgresql://knowbase:ci-test-only@localhost:5432/knowbase_test
      RAG_REQUIRE_POSTGRES_TESTS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m scripts.check_frontend
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m scripts.check
      - run: python -m scripts.chunk_experiment --mode local --output-dir reports/chunks-v2
      - run: python -m scripts.benchmark_stores --count 1000 --dimensions 384 --queries 20 --repeats 3 --require-postgres
      - name: Build and run Compose smoke
        env:
          RAG_PORT: '18000'
        run: |
          docker compose up --build -d --wait
          python -c "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:18000/api/health')); assert d['status']=='ok' and d['storage']=='pgvector'"
          python -m scripts.container_smoke --url http://127.0.0.1:18000
          docker compose restart app
          docker compose up -d --wait
          python -m scripts.container_smoke --url http://127.0.0.1:18000 --check-persistence
      - run: python -m scripts.benchmark_scale --sizes 1000 10000 100000 --dimensions 384 --queries 20 --repeats 3
      - name: Authenticated HTTPS portfolio demo smoke
        env:
          RAG_DEMO_DOMAIN: localhost
          RAG_PORT: '18001'
          RAG_HTTP_PORT: '18080'
          RAG_HTTPS_PORT: '18443'
          RAG_DEMO_USER_DAILY: '2'
          RAG_MODE: local
          RAG_API_KEY: ''
        run: |
          docker compose -f compose.demo.yaml config --quiet
          docker compose -f compose.demo.yaml up --build -d --wait
          docker compose -f compose.demo.yaml exec -T app python -m scripts.prepare_demo
          docker compose -f compose.demo.yaml exec -T app python -m scripts.manage_access create-user ci-reviewer --roles demo-reviewer --token-file /app/data/.secrets/ci-reviewer.txt
          mkdir -p .secrets
          docker compose -f compose.demo.yaml cp app:/app/data/.secrets/ci-reviewer.txt .secrets/ci-reviewer.txt
          curl -kfsS --retry 20 --retry-all-errors --retry-delay 2 https://localhost:18443/api/health > /dev/null
          docker compose -f compose.demo.yaml cp proxy:/data/caddy/pki/authorities/local/root.crt .secrets/demo-ca.crt
          python -m scripts.demo_smoke --ca .secrets/demo-ca.crt --token-file .secrets/ci-reviewer.txt
          docker compose -f compose.demo.yaml restart app
          docker compose -f compose.demo.yaml up -d --wait
          python -m scripts.demo_smoke --ca .secrets/demo-ca.crt --token-file .secrets/ci-reviewer.txt --after-restart
      - name: Container logs and shutdown
        if: always()
        run: |
          docker compose logs --no-color > reports/compose.log 2>&1 || true
          docker compose down
          RAG_DEMO_DOMAIN=localhost docker compose -f compose.demo.yaml logs --no-color > reports/compose-demo.log 2>&1 || true
          RAG_DEMO_DOMAIN=localhost docker compose -f compose.demo.yaml down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            reports/
            test-results/junit.xml
